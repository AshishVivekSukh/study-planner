<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Topper Mode</title>
<meta name="apple-mobile-web-app-title" content="Topper Mode">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#172033; --mute:#667085; --line:#e3e7ef;
  --brand:#1f3864; --brand-ink:#ffffff; --accent:#d9480f; --ok:#2b8a3e; --warn:#e67700; --bad:#c92a2a;
  --chip:#eef2f9; --focus:#d9480f; --rest:#2b8a3e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --card:#19202f; --ink:#e8ecf4; --mute:#9aa4b8; --line:#2a3346;
    --brand:#8fb0ee; --brand-ink:#0f1420; --accent:#ff8a50; --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
    --chip:#232c3f; --focus:#ff8a50; --rest:#69db7c; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-weight:700}
header .sub{font-size:12px;color:var(--mute)}
main{padding:4px 16px 96px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 2px 9px;font:inherit;font-size:12px;font-weight:600;position:relative}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)} .small{font-size:12.5px}
.title{font-weight:650;overflow-wrap:anywhere}
.item{padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:650;white-space:nowrap}
.chip.bad{background:var(--bad);color:#fff} .chip.warn{background:var(--warn);color:#fff}
.chip.ok{background:var(--ok);color:#fff} .chip.weak{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip.bad,.chip.warn,.chip.ok,.chip.weak{color:#0f1420}}
button.btn{font:inherit;font-weight:650;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;min-height:40px}
button.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.danger{color:var(--bad)}
button.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
button.btn.wide{width:100%}
button:active{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--chip);border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mute)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.n{background:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar.over i{background:var(--bad)} .bar.xp i{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bdg{background:var(--chip);border-radius:11px;padding:9px 5px;text-align:center;font-size:11px;color:var(--mute);opacity:.5}
.bdg.got{opacity:1;outline:2px solid var(--ok);color:var(--ink)}
.bdg b{display:block;font-size:12.5px;color:var(--ink)}
.acts2{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.tease{font-size:13px;color:var(--accent);font-weight:650;margin-top:9px}
ul.tips{margin:4px 0 0;padding-left:18px} ul.tips li{margin:5px 0}
#ob{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.obin{min-height:100%;max-width:520px;margin:0 auto;padding:26px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.obin h2{font-size:25px;margin:6px 0 6px;line-height:1.2}
.obin .lead{color:var(--mute);margin:0 0 14px}
.hero{width:84px;height:84px;border-radius:22px;margin:22px 0 10px}
.big{font-size:17px;font-weight:650;margin:14px 0 4px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit;color:var(--ink)}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.opt b{display:block;font-size:15.5px} .opt span{font-size:12.5px;color:var(--mute)}
ol.stepl{list-style:none;padding:0;margin:0;counter-reset:s}
.stepl li{position:relative;padding:11px 0 11px 46px;border-top:1px solid var(--line);counter-increment:s}
.stepl li:first-child{border-top:0}
.stepl li:before{content:counter(s);position:absolute;left:0;top:11px;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.stepl b{display:block} .stepl span{font-size:13px;color:var(--mute)}
.obnav{margin-top:auto;padding-top:20px;display:flex;gap:10px}
.obnav .btn{flex:1;min-height:46px}
.obdots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.obdots i{width:7px;height:7px;border-radius:4px;background:var(--line)} .obdots i.on{background:var(--brand);width:20px}
/* timer */
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--line)} .ring .pg{stroke:var(--focus);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring.rest .pg{stroke:var(--rest)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .phase{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.setdots{display:flex;gap:7px;justify-content:center;margin:6px 0 12px}
.setdots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--focus)}
.setdots i.f{background:var(--focus)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:650;font-size:13px;padding:7px 4px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label{display:block;font-size:12.5px;font-weight:650;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:42px}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.bars div{flex:1;text-align:center;font-size:10.5px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
.bars b{font-size:10.5px;color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:22px;font-size:13.5px;z-index:30;max-width:88vw;text-align:center}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header>
  <div><h1 id="hTitle">Today</h1><div class="sub" id="hSub"></div></div>
  <div class="row" style="gap:6px"><button class="btn sm" id="help" aria-label="Help" style="min-width:38px">?</button><button class="btn sm" id="gear" aria-label="Settings">Settings</button></div>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "studyPlanner.v1";
const DEF = { pomo:25, short:5, long:15, setSize:4, target:10, gaps:[1,3,7,15,30], weak:60, wake:true };
let S = load();
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  d = d || {};
  return { settings:Object.assign({}, DEF, d.settings||{}), topics:d.topics||[], sessions:d.sessions||[],
           days:d.days||{}, timer:d.timer||null, tab:d.tab||"today", draft:d.draft||{type:"Study",subject:"",topic:""},
           profile:d.profile||null, onboarded:!!d.onboarded };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Could not save: storage is full or blocked"); } }

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+Number(n)); return ymd(d); };
const nice = s => parse(s).toLocaleDateString(undefined, {day:"numeric", month:"short"});
const niceLong = s => parse(s).toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"short", year:"numeric"});
const hm = ms => new Date(ms).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
function dur(min){ min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h ? h+"h "+pad(m)+"m" : m+"m"; }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ---------- student types: each gets its own strategy ---------- */
const PROF = {
  school:{label:"School student", sub:"Class 1 to 12", extra:"Your class (optional)", ph:"e.g. Class 10", target:4,
    tips:["About 4 hours a day is enough: short daily sessions beat one long night.",
          "Finish each chapter in the days you plan, then revise it on the dates the app gives.",
          "Mark maths and science chapters as Numerical: they get extra days, first for theory, then for practice questions.",
          "Before a school test, the Revise list shows which chapters are fading."]},
  college:{label:"College student", sub:"Preparing for semester exams", extra:"Your course (optional)", ph:"e.g. B.Tech Civil, 3rd year", target:5,
    tips:["Plan each unit so it is finished before your internal or mid-semester exam.",
          "Every revision includes university PYQs of that unit. Numerical units get extra days for solving.",
          "In the week before exams, use full sittings of 4 Grinds to solve old question papers.",
          "Aim for 5 hours a day; raise it as exams come closer."]},
  both:{label:"College + competitive exam", sub:"Semester exams and GATE, ESE, SSC JE and similar", extra:"Which competitive exam?", ph:"e.g. GATE, SSC JE", target:7,
    tips:["Study each unit once for both: concepts for the semester, numericals for the competitive exam.",
          "Revise with competitive-exam PYQs: they also cover most university questions.",
          "When a semester exam is near, give its subjects at least 2 Grinds a day.",
          "Aim for 7 hours a day across both."]},
  comp:{label:"Passed out, preparing for a competitive exam", sub:"Full-time preparation", extra:"Which exam?", ph:"e.g. GATE, ESE, SSC JE, state AE", target:10,
    tips:["Treat it like a job: the same start time every day and a 10-hour target.",
          "Every revision includes exam PYQs and your accuracy is tracked. Numerical topics get extra days for practice.",
          "Take a full mock test every week and log it as PYQ / Test.",
          "Topics marked Weak (below 60% accuracy) need extra PYQs before their next revision."]}
};
const ptype = () => (OB && OB.type) || (S.profile && S.profile.type) || "comp";
const isSchool = () => ptype() === "school";
const Q = () => isSchool() ? "practice questions" : "PYQs";
const QC = () => isSchool() ? "Practice questions" : "PYQs";
const Qs = () => isSchool() ? "practice Qs" : "PYQs";

/* ---------- teasing and pride lines ---------- */
const TEASE = ["Your phone can wait. Your rank can't.",
  "Still scrolling? Someone with your syllabus just finished a Grind.",
  "Backbenchers make plans. Toppers press Start.",
  "\"I'll start tomorrow\" has never cleared an exam.",
  "Zero Grinds today. Your competition has already done three."];
function dayLine(){
  const n = sumPomo(sessOn(today())), i = Math.floor(parse(today()) / 86400000);
  if (!n) return TEASE[i % TEASE.length];
  const P = [n + " Grind" + (n > 1 ? "s" : "") + " done. Toppers don't stop at one.",
             "You showed up today. That's what toppers do.",
             "Good. Now beat yesterday."];
  return P[i % P.length];
}

/* ---------- help ---------- */
const HELP = {
  today:["Today", "This screen tells you what to do now.<ul class='tips'><li><b>Revise these first:</b> topics whose revision is due. Tap <b>Revise now</b> to open the timer, then <b>Mark done</b>.</li><li><b>Studying now:</b> topics you are learning, with the days you planned. Tap <b>Finished</b> when done: revisions then start by themselves.</li><li>Start each day here.</li></ul>"],
  timer:["Timer", "<ul class='tips'><li>One Grind = 25 min of full focus, then a 5 min break. After 4 Grinds, a 15 min break.</li><li>Each finished Grind is saved and gives 10 XP.</li><li>Keep the app open so the alarm rings on time. Phone face down.</li></ul>"],
  topics:["Topics", "<ul class='tips'><li>Every topic you are studying or revising.</li><li><b>+</b> adds a new topic with the days you plan to take.</li><li>Tap a topic to edit it, change its type, or undo a revision marked by mistake.</li></ul>"],
  log:["Log", "<ul class='tips'><li>Your sessions for any day. Tap one to add questions solved.</li><li><b>Day log:</b> sleep and wake time, target hours and wasted time. Fill it at night.</li><li>ALH = hours actually studied, ELH = target, TWT = total wasted time.</li></ul>"],
  stats:["Stats", "<ul class='tips'><li>Level, XP, streak and badges show your progress.</li><li><b>Efficiency</b> = hours studied ÷ target hours.</li><li>Your plan for your student type is at the bottom.</li></ul>"]
};
function infoSheet(title, html){
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = "<div class='sheet'><h3>"+esc(title)+"</h3><div style='margin-top:8px'>"+html+"</div>"
    + "<div class='acts'><button class='btn' data-a='tour'>Replay walkthrough</button><button class='btn pri' data-a='close'>Got it</button></div></div>";
  sc.addEventListener("click", e => {
    const a = e.target.dataset && e.target.dataset.a;
    if (e.target === sc || a === "close") sc.remove();
    if (a === "tour") { sc.remove(); openOnboarding(); }
  });
  document.body.appendChild(sc);
}
function planCard(){
  if (!S.profile) return "";
  const P = PROF[S.profile.type];
  return "<div class='card'><h2>Your plan · "+esc(P.label)+(S.profile.exam ? " · "+esc(S.profile.exam) : "")+"</h2><ul class='tips'>"
    + P.tips.map(t => "<li>"+esc(t)+"</li>").join("") + "</ul><div class='small mute' style='margin-top:8px'>Change your student type in Settings.</div></div>";
}

/* ---------- first-run walkthrough ---------- */
let OB = null;
function openOnboarding(){
  OB = {step:0, type:S.profile ? S.profile.type : null, exam:S.profile ? S.profile.exam : ""};
  drawOb();
}
function drawOb(){
  let el = $("#ob");
  if (!el) {
    el = document.createElement("div"); el.id = "ob"; document.body.appendChild(el);
    el.addEventListener("click", obClick);
    el.addEventListener("input", e => { if (e.target.id === "obExam") OB.exam = e.target.value; });
  }
  const st = OB.step, P = OB.type ? PROF[OB.type] : null, last = 3;
  let h = "<div class='obin'>";
  if (st === 0) {
    h += "<img class='hero' src='icon-192.png' alt=''><h2>Topper Mode</h2><p class='lead'>Phone down. Rank up.</p>"
      + "<p class='big'>Everyone says they'll start tomorrow. This app is for the ones who start today.</p>"
      + "<ul class='tips'><li>Study in 25-minute focus sessions</li><li>Never forget a revision: the app reminds you when</li><li>Earn XP, keep your streak, climb from Backbencher to Topper</li></ul>"
      + (S.topics.length || S.sessions.length ? "<p class='small mute' style='margin-top:14px'>Already using the app? Your data is safe. This takes 30 seconds.</p>" : "");
  } else if (st === 1) {
    h += "<h2>Who are you?</h2><p class='lead'>Your study plan depends on your answer. You can change it later.</p>";
    h += Object.keys(PROF).map(k => "<button class='opt"+(OB.type===k?" on":"")+"' data-ob='type' data-v='"+k+"'><b>"+esc(PROF[k].label)+"</b><span>"+esc(PROF[k].sub)+"</span></button>").join("");
    if (P) h += "<label for='obExam'>"+esc(P.extra)+"</label><input id='obExam' value='"+esc(OB.exam)+"' placeholder='"+esc(P.ph)+"'>";
  } else if (st === 2) {
    h += "<h2>How it works</h2><p class='lead'>Four habits. That's the whole app.</p><ol class='stepl'>"
      + "<li><b>Start a topic</b><span>Pick a topic or unit and the number of days you need. Slow or fast is fine: change the days any time.</span></li>"
      + "<li><b>Study with the timer</b><span>One Grind = 25 minutes of full focus, then a short break. Every Grind is saved and earns XP.</span></li>"
      + "<li><b>Tap Finished</b><span>When the topic is done, its 5 revisions are scheduled: 1, 3, 7, 15 and 30 days apart.</span></li>"
      + "<li><b>Revise when it is due</b><span>Today shows what to revise first. Every revision includes "+Q()+" of that topic.</span></li></ol>";
  } else {
    h += "<h2>Your plan</h2><p class='lead'>"+esc(P ? P.label + (OB.exam ? " · " + OB.exam : "") : "")+"</p><ul class='tips'>"
      + (P ? P.tips.map(t => "<li>"+esc(t)+"</li>").join("") : "") + "</ul>"
      + "<div class='card'><b>Daily target: "+(P ? P.target : S.settings.target)+" hours</b><div class='small mute'>A starting point. Change it any time in Settings.</div></div>";
  }
  h += "<div class='obnav'>"
    + (st === 0 ? "<button class='btn' data-ob='skip'>Skip</button>" : "<button class='btn' data-ob='back'>Back</button>")
    + (st < last ? "<button class='btn pri' data-ob='next'>"+(st === 0 ? "Let's start" : "Next")+"</button>"
                 : "<button class='btn pri' data-ob='done'>"+(S.topics.length ? "Let's go" : "Start my first topic")+"</button>")
    + "</div><div class='obdots'>"+[0,1,2,3].map(i => "<i class='"+(i===st?"on":"")+"'></i>").join("")+"</div></div>";
  el.innerHTML = h; el.scrollTop = 0;
}
function obClick(e){
  const b = e.target.closest("[data-ob]"); if (!b) return;
  const a = b.dataset.ob;
  if (a === "type") { OB.type = b.dataset.v; drawOb(); const i = $("#obExam"); if (i) i.focus({preventScroll:true}); return; }
  if (a === "back") { OB.step--; return drawOb(); }
  if (a === "next") { if (OB.step === 1 && !OB.type) return toast("Pick one to continue"); OB.step++; return drawOb(); }
  if (a === "skip" || a === "done") finishOb(a === "done");
}
function finishOb(firstTopic){
  if (OB.type) {
    const changed = !S.profile || S.profile.type !== OB.type;
    S.profile = {type:OB.type, exam:(OB.exam || "").trim()};
    if (changed) S.settings.target = PROF[OB.type].target;
  }
  S.onboarded = true; OB = null;
  const el = $("#ob"); if (el) el.remove();
  S.tab = "today"; save(); render(); window.scrollTo(0,0);
  if (firstTopic && !S.topics.length) addTopic();
}

/* ---------- revision logic ---------- */
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const planEnd = t => addDays(t.started || t.studied, Math.max(1, t.planDays || 1) - 1);
const studying = () => S.topics.filter(t => !t.studied).sort((a,b) => planEnd(a) < planEnd(b) ? -1 : 1);
const KINDS = {theory:"Theory", both:"Theory + numerical", numerical:"Numerical"};
const kindOf = t => t.kind || (t.numerical ? "numerical" : "theory");
const SUGGEST = {theory:5, both:7, numerical:9};          // suggested study days per type
const REV_GRINDS = {theory:1, both:2, numerical:2};       // suggested Grinds per revision
// Split the planned days: theory first, then numericals + PYQs.
function phases(kind, n){
  n = Math.max(1, n);
  if (kind === "theory" || n === 1) return [n, 0];
  const th = kind === "both" ? Math.ceil(n/2) : Math.max(1, Math.round(n*0.4));
  return [th, n - th];
}
// Revision dates if the topic is finished on `fin` and every revision is done on time.
const revPlan = fin => { const out = []; let d = fin; S.settings.gaps.forEach(g => { d = addDays(d, g); out.push(d); }); return out; };
function nextDue(t){
  if (!t.studied) return null;                 // revisions start only after the topic is finished
  const g = S.settings.gaps, n = t.done.length;
  if (n >= g.length) return null;
  return addDays(n === 0 ? t.studied : t.done[n-1], g[n]);
}
function status(t){
  const nd = nextDue(t), td = today();
  if (!t.studied) {
    if (td < t.started) return {k:"", label:daysBetween(td, t.started) === 1 ? "Starts tomorrow" : "Starts " + nice(t.started)};
    const over = daysBetween(planEnd(t), td);
    return over > 0 ? {k:"bad", label:over + (over === 1 ? " day over" : " days over")} : over === 0 ? {k:"warn", label:"Last day"} : {k:"", label:"Studying"};
  }
  if (!nd) return {k:"ok", label:"Mastered"};
  if (nd < td) return {k:"bad", label:"Overdue"};
  if (nd === td) return {k:"warn", label:"Due today"};
  if (t.acc != null && t.acc < S.settings.weak) return {k:"weak", label:"Weak"};
  return {k:"", label:"Upcoming"};
}
const dueList = () => S.topics.filter(t => { const n = nextDue(t); return n && n <= today(); })
                              .sort((a,b) => nextDue(a) < nextDue(b) ? -1 : 1);
const sessOn = d => S.sessions.filter(s => s.date === d);
const sumMin = a => a.reduce((x,s) => x + s.min, 0);
const sumPomo = a => a.reduce((x,s) => x + (s.pomos||0), 0);
function accOf(a){ const q = a.reduce((x,s)=>x+(s.qa||0),0), c = a.reduce((x,s)=>x+(s.qc||0),0); return q ? Math.round(100*c/q) : null; }
const subjects = () => [...new Set(S.topics.map(t=>t.subject).concat(S.sessions.map(s=>s.subject)).filter(Boolean))].sort();

/* ---------- progress game (all derived from the data, nothing stored) ---------- */
const TITLES = ["Backbencher","Late Starter","Warming Up","Regular","Focused","Grinder","Front Bencher","Rank Holder","Gold Medalist","Topper"];
function game(){
  const g = S.settings.gaps, byDay = {};
  S.sessions.forEach(s => { byDay[s.date] = (byDay[s.date]||0) + s.min; });
  const dates = Object.keys(byDay).sort(), pomos = sumPomo(S.sessions);
  let xp = pomos*10, revOn = 0, revAll = 0, finOn = 0, finAll = 0, fin = 0, mastered = 0, qa = 0, qc = 0, targetDays = 0;
  S.sessions.forEach(s => { qa += s.qa||0; qc += s.qc||0; });
  S.topics.forEach(t => {
    (t.pyq||[]).forEach(p => { if (p) { qa += p[0]; qc += p[1]; } });
    if (!t.studied) return;
    fin++;
    if (t.planDays) { finAll++; if (t.studied <= planEnd(t)) { finOn++; xp += 50; } else xp += 25; }
    let prev = t.studied;
    t.done.forEach((d, i) => { revAll++; if (g[i] != null && d <= addDays(prev, g[i])) { revOn++; xp += 20; } else xp += 10; prev = d; });
    if (t.done.length >= g.length) { mastered++; xp += 100; }
  });
  xp += qc;
  dates.forEach(d => { const e = (S.days[d] && S.days[d].elh != null ? S.days[d].elh : S.settings.target) * 60; if (e && byDay[d] >= e) { targetDays++; xp += 30; } });
  let best = 0, run = 0, pd = null;
  dates.forEach(d => { run = pd && addDays(pd, 1) === d ? run + 1 : 1; best = Math.max(best, run); pd = d; });
  let streak = 0, c = byDay[today()] ? today() : addDays(today(), -1);
  while (byDay[c]) { streak++; c = addDays(c, -1); }
  let lvl = 1; while (xp >= 100*lvl*(lvl+1)) lvl++;
  const lo = 100*(lvl-1)*lvl, hi = 100*lvl*(lvl+1);
  const acc = qa ? Math.round(100*qc/qa) : null;
  const badges = [
    ["First Grind", "Finish 1 Grind", pomos >= 1], ["25 Grinds", "Finish 25", pomos >= 25], ["100 Grinds", "Finish 100", pomos >= 100],
    ["3-day streak", "Study 3 days in a row", best >= 3], ["7-day streak", "Study 7 days in a row", best >= 7], ["30-day streak", "Study 30 days in a row", best >= 30],
    ["Finisher", "Finish a topic", fin >= 1], ["On plan", "Finish a topic within your planned days", finOn >= 1], ["On-time reviser", "Do 5 revisions on their due date", revOn >= 5],
    ["Mastered", "Complete all revisions of a topic", mastered >= 1], ["Target day", "Reach your daily target hours", targetDays >= 1], ["Sharp solver", "80%+ on 20 or more questions", qa >= 20 && acc >= 80]
  ];
  return {xp, lvl, lo, hi, pct:Math.round(100*(xp-lo)/(hi-lo)), title:TITLES[Math.min(lvl, TITLES.length)-1], streak, best, revOn, revAll, finOn, finAll, mastered, acc, badges};
}
function levelBlock(G){
  return "<div class='row between'><div class='title'>Level "+G.lvl+" · "+G.title+"</div><span class='chip"+(G.streak?" ok":"")+"'>"+(G.streak ? G.streak+"-day streak" : "No streak yet")+"</span></div>"
    + "<div class='bar xp'><i style='width:"+G.pct+"%'></i></div><div class='small mute' style='margin-top:5px'>"+G.xp+" XP · "+(G.hi-G.xp)+" more to reach Level "+(G.lvl+1)+"</div>";
}
function progressCard(){
  const G = game(), wk = o => { let m = 0; for (let i=0;i<7;i++) m += sumMin(sessOn(addDays(today(), -i-o))); return m; };
  const a = wk(0), b = wk(7), tw = 7*S.settings.target*60, d = a - b;
  return "<div class='card'><h2>Your progress</h2>" + levelBlock(G) + "<div class='stats' style='margin-top:12px'>"
    + "<div class='stat'><b>"+(a/60).toFixed(1)+" h</b><span>Last 7 days · "+(d>0?"up "+dur(d):d<0?"down "+dur(-d):"same")+" vs the 7 before</span></div>"
    + "<div class='stat'><b>"+Math.round(100*a/tw)+"%</b><span>Efficiency, last 7 days (was "+Math.round(100*b/tw)+"%)</span></div>"
    + "<div class='stat'><b>"+G.streak+(G.streak===1?" day":" days")+"</b><span>Streak · best "+G.best+"</span></div>"
    + "<div class='stat'><b>"+G.finOn+" of "+G.finAll+"</b><span>Topics finished within plan</span></div>"
    + "<div class='stat'><b>"+G.revOn+" of "+G.revAll+"</b><span>Revisions done on time</span></div>"
    + "<div class='stat'><b>"+G.mastered+"</b><span>Topics mastered</span></div></div>"
    + "<div class='badges'>"+G.badges.map(x => "<div class='bdg"+(x[2]?" got":"")+"'><b>"+x[0]+"</b>"+x[1]+"</div>").join("")+"</div>"
    + "<div class='small mute' style='margin-top:10px'>XP: 10 per Grind · 50 for finishing a topic within plan (25 if late) · 20 per on-time revision (10 if late) · 100 per mastered topic · 30 for a target day · 1 per correct question.</div></div>";
}

/* ---------- generic bottom sheet form ---------- */
function sheet(title, fields, onSave, opts={}){
  const sc = document.createElement("div"); sc.className = "scrim";
  const sh = document.createElement("div"); sh.className = "sheet"; sc.appendChild(sh);
  let h = "<h3>"+esc(title)+"</h3>" + (opts.note ? "<div class='mute small'>"+esc(opts.note)+"</div>" : "");
  h += "<datalist id='subjList'>"+subjects().map(s=>"<option value='"+esc(s)+"'>").join("")+"</datalist>";
  fields.forEach(f => {
    h += "<label for='f_"+f.k+"'>"+esc(f.label)+"</label>";
    if (f.type === "select") h += "<select id='f_"+f.k+"'>"+f.options.map(o=>"<option"+(o===f.value?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>";
    else h += "<input id='f_"+f.k+"' type='"+(f.type||"text")+"' value='"+esc(f.value==null?"":f.value)+"'"
      + (f.ph?" placeholder='"+esc(f.ph)+"'":"") + (f.list?" list='subjList'":"")
      + (f.type==="number"?" inputmode='decimal' step='any' min='0'":"") + ">";
  });
  if (opts.live) h += "<div class='card' id='liveBox' style='margin:14px 0 0'></div>";
  h += "<div class='acts'><button class='btn' data-a='cancel'>Cancel</button>";
  if (opts.del) h += "<button class='btn danger' data-a='del'>Delete</button>";
  h += "<button class='btn pri' data-a='save'>"+esc(opts.saveLabel||"Save")+"</button></div>";
  sh.innerHTML = h;
  if (opts.live) { const up = e => opts.live(sh, e); sh.addEventListener("input", up); sh.addEventListener("change", up); up(null); }
  const close = () => sc.remove();
  sc.addEventListener("click", e => {
    if (e.target === sc) return close();
    const a = e.target.dataset.a;
    if (a === "cancel") close();
    if (a === "del") { if (confirm("Delete this?")) { opts.del(); close(); save(); render(); } }
    if (a === "save") {
      const v = {}; fields.forEach(f => v[f.k] = $("#f_"+f.k, sh).value.trim());
      const err = onSave(v);
      if (err) return toast(err);
      close(); save(); render();
    }
  });
  document.body.appendChild(sc);
}

/* ---------- actions ---------- */
const kindOpts = () => Object.values(KINDS);
const kindKey = label => Object.keys(KINDS).find(k => KINDS[k] === label) || "theory";
const FIN = ["No, I'm starting it", "Yes, already finished: just schedule revisions"];
const dd = d => parse(d).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
function topicPreview(sh, e){
  const g = id => $("#f_" + id, sh), kind = kindKey(g("kind").value), done = g("fin").value === FIN[1];
  if (e && e.target.id === "f_days") sh.dataset.daysTouched = "1";
  if (!sh.dataset.daysTouched && !done) g("days").value = SUGGEST[kind];
  // show or hide the days field, and relabel the date
  g("days").style.display = done ? "none" : ""; $("label[for=f_days]", sh).style.display = done ? "none" : "";
  $("label[for=f_date]", sh).textContent = done ? "When did you finish it?" : "When do you start?";
  const date = g("date").value, n = Math.round(+g("days").value), box = $("#liveBox", sh);
  if (!date || (!done && !(n >= 1))) { box.innerHTML = "<span class='mute small'>Pick a date and the days you need to see your schedule.</span>"; return; }
  const fin = done ? date : addDays(date, n - 1), q = Q();
  let h = "";
  if (!done) {
    const [th, pr] = phases(kind, n);
    h += "<div class='title'>Study: " + dd(date) + " → " + dd(fin) + " (" + n + " day" + (n > 1 ? "s" : "") + ")</div>";
    if (pr) h += "<div class='small' style='margin-top:4px'>Theory: " + dd(date) + (th > 1 ? " → " + dd(addDays(date, th - 1)) : "")
      + "<br>Numericals + " + q + ": " + dd(addDays(date, th)) + (pr > 1 ? " → " + dd(fin) : "") + "</div>";
    if (kind !== "theory") h += "<div class='small mute' style='margin-top:4px'>Numerical topics need more days: suggested " + SUGGEST[kind] + " (theory: " + SUGGEST.theory + "). Change it to your speed.</div>";
  }
  h += "<div class='title' style='margin-top:10px'>Revisions" + (done ? "" : " if you finish on time") + "</div><div class='small'>"
    + revPlan(fin).map((d, i) => "R" + (i + 1) + ": " + dd(d)).join(" · ") + "</div>"
    + "<div class='small mute' style='margin-top:4px'>Every revision: revise your notes, then solve " + q + " of this topic (about " + REV_GRINDS[kind] + " Grind" + (REV_GRINDS[kind] > 1 ? "s" : "") + ").</div>";
  box.innerHTML = h;
}
function addTopic(){
  sheet("New topic or unit", [
    {k:"subject", label:"Subject", list:true, ph:isSchool() ? "e.g. Maths" : "e.g. Steel Structure"},
    {k:"topic", label:isSchool() ? "Chapter" : "Topic / unit", ph:isSchool() ? "e.g. Ch 4 - Quadratic Equations" : "e.g. Compression Members"},
    {k:"kind", label:"Type", type:"select", options:kindOpts(), value:KINDS.theory},
    {k:"date", label:"When do you start?", type:"date", value:today()},
    {k:"days", label:"Days you plan to take", type:"number", value:SUGGEST.theory},
    {k:"fin", label:"Already finished this topic?", type:"select", options:FIN, value:FIN[0]}
  ], v => {
    if (!v.subject || !v.topic || !v.date) return "Fill subject, topic and date";
    const kind = kindKey(v.kind);
    const o = {id:uid(), subject:v.subject, topic:v.topic, kind, numerical:kind !== "theory", started:v.date, planDays:null, studied:null, done:[], pyq:[], acc:null};
    if (v.fin === FIN[1]) { if (v.date > today()) return "A finished topic can't have a future date"; o.studied = v.date; }
    else { if (!(+v.days >= 1)) return "Days planned must be 1 or more"; o.planDays = Math.round(+v.days); }
    S.topics.push(o);
    setTimeout(() => toast(o.studied ? "First revision: " + nice(nextDue(o)) : "Finish by " + nice(planEnd(o)) + ". Go get it."), 50);
  }, {live:topicPreview, note:"Pick your own pace. You can change the days later. Revisions start when you tap Finished."});
}
function planForm(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  const day = daysBetween(t.started, today()) + 1;
  sheet("Change plan", [
    {k:"days", label:"Total days planned for this topic", type:"number", value:t.planDays || 1}
  ], v => {
    if (!(+v.days >= 1)) return "Days planned must be 1 or more";
    t.planDays = Math.round(+v.days);
    setTimeout(() => toast("New finish date: " + nice(planEnd(t))), 50);
  }, {note:t.topic + " · today is day " + Math.max(day, 1) + ". Give yourself more days or fewer, whatever fits your speed."});
}
function finishTopic(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  sheet("Topic finished", [
    {k:"date", label:"Finished on", type:"date", value:today()}
  ], v => {
    if (!v.date) return "Pick a date";
    if (v.date < t.started) return "Date is before the start date (" + nice(t.started) + ")";
    t.studied = v.date; t.done = []; t.pyq = [];
    const took = daysBetween(t.started, v.date) + 1;
    setTimeout(() => toast("Done in " + took + " of " + (t.planDays||took) + " planned days. First revision: " + nice(nextDue(t))), 50);
  }, {note:t.subject + " · " + t.topic + ". Revisions begin now, each with " + Q() + " of this topic.", saveLabel:"Mark finished"});
}
function markDone(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  sheet("Revision " + (t.done.length+1) + " done", [
    {k:"date", label:"Revised on", type:"date", value:today()},
    {k:"qa", label:QC() + " attempted (required)", type:"number", ph:"e.g. 20"},
    {k:"qc", label:QC() + " correct", type:"number", ph:"e.g. 15"}
  ], v => {
    if (!v.date) return "Pick a date";
    const prev = t.done.length ? t.done[t.done.length-1] : t.studied;
    if (v.date < prev) return "Date is before the previous step (" + nice(prev) + ")";
    const qa = Math.round(+v.qa), qc = Math.round(+v.qc || 0);
    if (!(qa >= 1)) return "Solve the " + Q() + " of this topic first, then enter how many";
    if (qc > qa) return "Correct cannot be more than attempted";
    t.pyq = t.pyq || []; t.pyq[t.done.length] = [qa, qc]; t.acc = Math.round(100*qc/qa);
    t.done.push(v.date);
    const n = nextDue(t);
    setTimeout(() => toast(n ? "Next revision: " + nice(n) : "All revisions done. Topic mastered!"), 50);
  }, {note:t.subject + " · " + t.topic + " · every revision includes " + Q(), saveLabel:"Mark done"});
}
function editTopic(id){

  ], v => {

    t.acc = v.acc === "" ? null : +v.acc;

    t.done = t.done.slice(0, keep); t.pyq = (t.pyq || []).slice(0, keep);
  }, {del:() => { S.topics = S.topics.filter(x => x.id !== id); }, note:"Lower 'Revisions done' to undo a revision marked by mistake."});
}

function sessionForm(s){
  const isNew = !s;
  const d0 = isNew ? today() : s.date;
  const t = ms => { const d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  sheet(isNew ? "Add session" : "Edit session", [
    {k:"date", label:"Date", type:"date", value:d0},
    {k:"type", label:"Type", type:"select", options:["Study","Revision","PYQ / Test"], value:isNew?"Study":s.type},
    {k:"subject", label:"Subject", list:true, value:isNew?"":s.subject},
    {k:"topic", label:"Topic / lecture", value:isNew?"":s.topic},
    {k:"start", label:"Start time", type:"time", value:isNew?"":t(s.start)},
    {k:"end", label:"End time", type:"time", value:isNew?"":t(s.end)},
    {k:"qa", label:"Questions attempted", type:"number", value:isNew?"":(s.qa||"")},
    {k:"qc", label:"Questions correct", type:"number", value:isNew?"":(s.qc||"")}
  ], v => {
    if (!v.date || !v.start || !v.end) return "Fill date, start and end time";
    const base = parse(v.date);
    const mk = x => { const [h,m] = x.split(":").map(Number); return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m).getTime(); };
    let st = mk(v.start), en = mk(v.end);
    if (en <= st) en += 86400000;               // crossed midnight
    const qa = +v.qa || 0, qc = +v.qc || 0;
    if (qc > qa) return "Correct cannot be more than attempted";
    const min = Math.round((en - st)/60000);
    const o = isNew ? {id:uid()} : s;
    const timesChanged = isNew || o.start !== st || o.end !== en;
    Object.assign(o, {date:v.date, type:v.type, subject:v.subject, topic:v.topic, start:st, end:en, min, qa, qc});
    if (timesChanged) o.pomos = Math.floor(min / S.settings.pomo);
    if (isNew) S.sessions.push(o);
  }, isNew ? {} : {del:() => { S.sessions = S.sessions.filter(x => x.id !== s.id); }});
}

/* ---------- timer ---------- */
let wakeLock = null, audio = null;
const phaseMin = p => p === "focus" ? S.settings.pomo : p === "short" ? S.settings.short : S.settings.long;
function timerRemaining(){
  const t = S.timer; if (!t) return S.settings.pomo * 60000;
  return t.running ? Math.max(0, t.endAt - Date.now()) : t.left;
}
async function wake(on){
  try {
    if (on && S.settings.wake && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function startTimer(){
  if (!audio) { try { audio = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(()=>{});
  let t = S.timer;
  if (!t) t = S.timer = {phase:"focus", count:0, left:S.settings.pomo*60000, running:false, total:S.settings.pomo*60000};
  if (t.phase === "focus" && t.left === t.total) Object.assign(t, {type:S.draft.type, subject:S.draft.subject, topic:S.draft.topic});
  t.endAt = Date.now() + t.left; t.running = true;
  wake(t.phase === "focus"); save(); render();
}
function pauseTimer(){ const t = S.timer; if (!t || !t.running) return; t.left = Math.max(0, t.endAt - Date.now()); t.running = false; wake(false); save(); render(); }
function logFocus(t, endMs, minutes, pomos){
  if (minutes < 1) return;
  const st = endMs - minutes*60000;
  S.sessions.push({id:uid(), date:ymd(new Date(st)), type:t.type||"Study", subject:t.subject||"", topic:t.topic||"", start:st, end:endMs, min:Math.round(minutes), pomos, qa:0, qc:0});
}
function stopTimer(){
  const t = S.timer; if (!t) return;
  if (t.phase === "focus") {
    const done = (t.total - timerRemaining()) / 60000;
    if (done >= 1 && confirm("Stop now and log " + Math.round(done) + " min as a session? (It will not count as a full Grind.)")) logFocus(t, Date.now(), done, 0);
    S.timer = {phase:"focus", count:t.count, left:S.settings.pomo*60000, total:S.settings.pomo*60000, running:false};
  } else {
    S.timer = {phase:"focus", count:t.count, left:S.settings.pomo*60000, total:S.settings.pomo*60000, running:false};
  }
  wake(false); save(); render();
}
function resetSet(){ S.timer = null; wake(false); save(); render(); }
function alertUser(title, body){
  try { if (audio) { const now = audio.currentTime;
    [0, .35, .7].forEach(d => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.001, now+d); g.gain.exponentialRampToValueAtTime(.4, now+d+.02); g.gain.exponentialRampToValueAtTime(.001, now+d+.28); o.start(now+d); o.stop(now+d+.3); }); } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
  try { if ("Notification" in window && Notification.permission === "granted") {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:"icon-192.png", tag:"pomo", renotify:true})).catch(()=>{});
    else new Notification(title, {body});
  } } catch(e){}
  toast(title);
}
function phaseEnd(){
  const t = S.timer, end = t.endAt;
  if (t.phase === "focus") {
    logFocus(t, end, t.total/60000, 1);
    const count = t.count + 1, long = count % S.settings.setSize === 0;
    const ph = long ? "long" : "short", ms = phaseMin(ph)*60000;
    S.timer = {phase:ph, count, left:ms, total:ms, running:true, endAt:end + ms, type:t.type, subject:t.subject, topic:t.topic};
    alertUser("Grind done", long ? "Take a long break: " + S.settings.long + " min" : "Short break: " + S.settings.short + " min");
  } else {
    const ms = S.settings.pomo*60000;
    S.timer = {phase:"focus", count:t.count, left:ms, total:ms, running:false};
    alertUser("Break over", "Start your next Grind");
  }
  wake(false); save(); render();
}
setInterval(() => {

  if (!el || el.closest(".sheet")) return;
  const d = el.dataset;
  if (d.tab || d.go) { S.tab = d.tab || d.go; save(); render(); window.scrollTo(0,0); }
  else if (d.revise) reviseNow(d.revise);
  else if (d.done) markDone(d.done);
  else if (d.study) studyNow(d.study);
  else if (d.finish) finishTopic(d.finish);
  else if (d.plan) planForm(d.plan);
  else if (d.edit) editTopic(d.edit);
  else if (d.add === "topic") addTopic();
  else if (d.add === "session") sessionForm(null);
  else if (d.sess) sessionForm(S.sessions.find(s => s.id === d.sess));
  else if (d.type) { S.draft.type = d.type; save(); render(); }
  else if (d.t === "start") startTimer();
  else if (d.t === "pause") pauseTimer();
  else if (d.t === "stop") stopTimer();
  else if (d.t === "reset") resetSet();
  else if (d.day) { const n = addDays(logDate, +d.day); if (n <= today()) { logDate = n; render(); } }
  else if (d.dayform) dayForm(logDate);
});
document.addEventListener("input", e => {
  if (e.target.id === "dSub") { S.draft.subject = e.target.value; save(); }
  if (e.target.id === "dTop") { S.draft.topic = e.target.value; save(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "ld" && e.target.value) { logDate = e.target.value > today() ? today() : e.target.value; render(); }
  if (e.target.id === "tf") { topicFilter = e.target.value; render(); }
});
$("#gear").addEventListener("click", settingsForm);
$("#help").addEventListener("click", () => { const x = HELP[S.tab] || HELP.today; infoSheet(x[0], x[1]); });
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
if (!S.onboarded) openOnboarding();
</script>
</body>
</html>
