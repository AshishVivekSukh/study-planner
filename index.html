<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Study Planner</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#172033; --mute:#667085; --line:#e3e7ef;
  --brand:#1f3864; --brand-ink:#ffffff; --accent:#d9480f; --ok:#2b8a3e; --warn:#e67700; --bad:#c92a2a;
  --chip:#eef2f9; --focus:#d9480f; --rest:#2b8a3e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1420; --card:#19202f; --ink:#e8ecf4; --mute:#9aa4b8; --line:#2a3346;
    --brand:#8fb0ee; --brand-ink:#0f1420; --accent:#ff8a50; --ok:#69db7c; --warn:#ffc078; --bad:#ff8787;
    --chip:#232c3f; --focus:#ff8a50; --rest:#69db7c; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0;font-weight:700}
header .sub{font-size:12px;color:var(--mute)}
main{padding:4px 16px 96px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 2px 9px;font:inherit;font-size:12px;font-weight:600;position:relative}
nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)} .small{font-size:12.5px}
.title{font-weight:650;overflow-wrap:anywhere}
.item{padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:650;white-space:nowrap}
.chip.bad{background:var(--bad);color:#fff} .chip.warn{background:var(--warn);color:#fff}
.chip.ok{background:var(--ok);color:#fff} .chip.weak{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip.bad,.chip.warn,.chip.ok,.chip.weak{color:#0f1420}}
button.btn{font:inherit;font-weight:650;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;min-height:40px}
button.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.danger{color:var(--bad)}
button.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
button.btn.wide{width:100%}
button:active{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--chip);border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mute)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--ok)} .dots i.n{background:var(--warn)}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
/* timer */
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .tr{stroke:var(--line)} .ring .pg{stroke:var(--focus);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring.rest .pg{stroke:var(--rest)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .time{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .phase{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.setdots{display:flex;gap:7px;justify-content:center;margin:6px 0 12px}
.setdots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--focus)}
.setdots i.f{background:var(--focus)}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:650;font-size:13px;padding:7px 4px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label{display:block;font-size:12.5px;font-weight:650;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:42px}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sheet .acts .btn{flex:1}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.bars div{flex:1;text-align:center;font-size:10.5px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--brand);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
.bars b{font-size:10.5px;color:var(--ink);font-weight:600}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:22px;font-size:13.5px;z-index:30;max-width:88vw;text-align:center}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header>
  <div><h1 id="hTitle">Today</h1><div class="sub" id="hSub"></div></div>
  <button class="btn sm" id="gear" aria-label="Settings">Settings</button>
</header>
<main id="view"></main>
<nav id="nav"></nav>

<script>
"use strict";
/* ---------- storage ---------- */
const KEY = "studyPlanner.v1";
const DEF = { pomo:25, short:5, long:15, setSize:4, target:10, gaps:[1,3,7,15,30], weak:60, wake:true };
let S = load();
function load(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  d = d || {};
  return { settings:Object.assign({}, DEF, d.settings||{}), topics:d.topics||[], sessions:d.sessions||[],
           days:d.days||{}, timer:d.timer||null, tab:d.tab||"today", draft:d.draft||{type:"Study",subject:"",topic:""} };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Could not save: storage is full or blocked"); } }

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+Number(n)); return ymd(d); };
const nice = s => parse(s).toLocaleDateString(undefined, {day:"numeric", month:"short"});
const niceLong = s => parse(s).toLocaleDateString(undefined, {weekday:"long", day:"numeric", month:"short", year:"numeric"});
const hm = ms => new Date(ms).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
function dur(min){ min = Math.round(min); const h = Math.floor(min/60), m = min%60; return h ? h+"h "+pad(m)+"m" : m+"m"; }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

/* ---------- revision logic ---------- */
function nextDue(t){
  const g = S.settings.gaps, n = t.done.length;
  if (n >= g.length) return null;
  return addDays(n === 0 ? t.studied : t.done[n-1], g[n]);
}
function status(t){
  const nd = nextDue(t), td = today();
  if (!nd) return {k:"ok", label:"Mastered"};
  if (nd < td) return {k:"bad", label:"Overdue"};
  if (nd === td) return {k:"warn", label:"Due today"};
  if (t.acc != null && t.acc < S.settings.weak) return {k:"weak", label:"Weak"};
  return {k:"", label:"Upcoming"};
}
const dueList = () => S.topics.filter(t => { const n = nextDue(t); return n && n <= today(); })
                              .sort((a,b) => nextDue(a) < nextDue(b) ? -1 : 1);
const sessOn = d => S.sessions.filter(s => s.date === d);
const sumMin = a => a.reduce((x,s) => x + s.min, 0);
const sumPomo = a => a.reduce((x,s) => x + (s.pomos||0), 0);
function accOf(a){ const q = a.reduce((x,s)=>x+(s.qa||0),0), c = a.reduce((x,s)=>x+(s.qc||0),0); return q ? Math.round(100*c/q) : null; }
const subjects = () => [...new Set(S.topics.map(t=>t.subject).concat(S.sessions.map(s=>s.subject)).filter(Boolean))].sort();

/* ---------- generic bottom sheet form ---------- */
function sheet(title, fields, onSave, opts={}){
  const sc = document.createElement("div"); sc.className = "scrim";
  const sh = document.createElement("div"); sh.className = "sheet"; sc.appendChild(sh);
  let h = "<h3>"+esc(title)+"</h3>" + (opts.note ? "<div class='mute small'>"+esc(opts.note)+"</div>" : "");
  h += "<datalist id='subjList'>"+subjects().map(s=>"<option value='"+esc(s)+"'>").join("")+"</datalist>";
  fields.forEach(f => {
    h += "<label for='f_"+f.k+"'>"+esc(f.label)+"</label>";
    if (f.type === "select") h += "<select id='f_"+f.k+"'>"+f.options.map(o=>"<option"+(o===f.value?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>";
    else h += "<input id='f_"+f.k+"' type='"+(f.type||"text")+"' value='"+esc(f.value==null?"":f.value)+"'"
      + (f.ph?" placeholder='"+esc(f.ph)+"'":"") + (f.list?" list='subjList'":"")
      + (f.type==="number"?" inputmode='decimal' step='any' min='0'":"") + ">";
  });
  h += "<div class='acts'><button class='btn' data-a='cancel'>Cancel</button>";
  if (opts.del) h += "<button class='btn danger' data-a='del'>Delete</button>";
  h += "<button class='btn pri' data-a='save'>"+esc(opts.saveLabel||"Save")+"</button></div>";
  sh.innerHTML = h;
  const close = () => sc.remove();
  sc.addEventListener("click", e => {
    if (e.target === sc) return close();
    const a = e.target.dataset.a;
    if (a === "cancel") close();
    if (a === "del") { if (confirm("Delete this?")) { opts.del(); close(); save(); render(); } }
    if (a === "save") {
      const v = {}; fields.forEach(f => v[f.k] = $("#f_"+f.k, sh).value.trim());
      const err = onSave(v);
      if (err) return toast(err);
      close(); save(); render();
    }
  });
  document.body.appendChild(sc);
}

/* ---------- actions ---------- */
function addTopic(){
  sheet("New topic studied", [
    {k:"subject", label:"Subject", list:true, ph:"e.g. RCC"},
    {k:"topic", label:"Topic / lecture", ph:"e.g. Ch 1 - Basic Concepts"},
    {k:"studied", label:"Studied on", type:"date", value:today()}
  ], v => {
    if (!v.subject || !v.topic || !v.studied) return "Fill subject, topic and date";
    S.topics.push({id:uid(), subject:v.subject, topic:v.topic, studied:v.studied, done:[], acc:null});
  }, {note:"Revision dates are set automatically: " + S.settings.gaps.join(", ") + " days apart."});
}
function markDone(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  sheet("Revision " + (t.done.length+1) + " done", [
    {k:"date", label:"Revised on", type:"date", value:today()},
    {k:"acc", label:"Question accuracy % (optional)", type:"number", ph:"e.g. 78"}
  ], v => {
    if (!v.date) return "Pick a date";
    const prev = t.done.length ? t.done[t.done.length-1] : t.studied;
    if (v.date < prev) return "Date is before the previous step (" + nice(prev) + ")";
    if (v.acc !== "" && (isNaN(+v.acc) || +v.acc > 100)) return "Accuracy must be 0 to 100";
    t.done.push(v.date);
    if (v.acc !== "") t.acc = +v.acc;
    const n = nextDue(t);
    setTimeout(() => toast(n ? "Next revision: " + nice(n) : "All 5 revisions done"), 50);
  }, {note:t.subject + " · " + t.topic, saveLabel:"Mark done"});
}
function editTopic(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  sheet("Edit topic", [
    {k:"subject", label:"Subject", list:true, value:t.subject},
    {k:"topic", label:"Topic / lecture", value:t.topic},
    {k:"studied", label:"Studied on", type:"date", value:t.studied},
    {k:"acc", label:"Last accuracy %", type:"number", value:t.acc==null?"":t.acc},
    {k:"undo", label:"Revisions done", type:"select", value:String(t.done.length),
      options:Array.from({length:t.done.length+1}, (_,i)=>String(i))}
  ], v => {
    if (!v.subject || !v.topic || !v.studied) return "Fill subject, topic and date";
    t.subject = v.subject; t.topic = v.topic; t.studied = v.studied;
    t.acc = v.acc === "" ? null : +v.acc; t.done = t.done.slice(0, +v.undo);
  }, {del:() => { S.topics = S.topics.filter(x => x.id !== id); }, note:"Lower 'Revisions done' to undo a revision marked by mistake."});
}
function reviseNow(id){
  const t = S.topics.find(x => x.id === id); if (!t) return;
  S.draft = {type:"Revision", subject:t.subject, topic:t.topic + " (R" + (t.done.length+1) + ")"};
  S.tab = "timer"; save(); render();
}
function sessionForm(s){
  const isNew = !s;
  const d0 = isNew ? today() : s.date;
  const t = ms => { const d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); };
  sheet(isNew ? "Add session" : "Edit session", [
    {k:"date", label:"Date", type:"date", value:d0},
    {k:"type", label:"Type", type:"select", options:["Study","Revision","PYQ / Test"], value:isNew?"Study":s.type},
    {k:"subject", label:"Subject", list:true, value:isNew?"":s.subject},
    {k:"topic", label:"Topic / lecture", value:isNew?"":s.topic},
    {k:"start", label:"Start time", type:"time", value:isNew?"":t(s.start)},
    {k:"end", label:"End time", type:"time", value:isNew?"":t(s.end)},
    {k:"qa", label:"Questions attempted", type:"number", value:isNew?"":(s.qa||"")},
    {k:"qc", label:"Questions correct", type:"number", value:isNew?"":(s.qc||"")}
  ], v => {
    if (!v.date || !v.start || !v.end) return "Fill date, start and end time";
    const base = parse(v.date);
    const mk = x => { const [h,m] = x.split(":").map(Number); return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m).getTime(); };
    let st = mk(v.start), en = mk(v.end);
    if (en <= st) en += 86400000;               // crossed midnight
    const qa = +v.qa || 0, qc = +v.qc || 0;
    if (qc > qa) return "Correct cannot be more than attempted";
    const min = Math.round((en - st)/60000);
    const o = isNew ? {id:uid()} : s;
    const timesChanged = isNew || o.start !== st || o.end !== en;
    Object.assign(o, {date:v.date, type:v.type, subject:v.subject, topic:v.topic, start:st, end:en, min, qa, qc});
    if (timesChanged) o.pomos = Math.floor(min / S.settings.pomo);
    if (isNew) S.sessions.push(o);
  }, isNew ? {} : {del:() => { S.sessions = S.sessions.filter(x => x.id !== s.id); }});
}
function dayForm(d){
  const x = S.days[d] || {};
  sheet("Day log · " + nice(d), [
    {k:"st", label:"ST · Sleep time (went to bed)", type:"time", value:x.st||""},
    {k:"wut", label:"WUT · Wake up time", type:"time", value:x.wut||""},
    {k:"elh", label:"ELH · Target study hours", type:"number", value:x.elh==null?S.settings.target:x.elh},
    {k:"wt", label:"WT · Wasted time (minutes)", type:"number", value:x.wt==null?"":x.wt},
    {k:"wtm", label:"WTM · Wasted on mobile (minutes)", type:"number", value:x.wtm==null?"":x.wtm}
  ], v => {
    S.days[d] = {st:v.st, wut:v.wut, elh:v.elh===""?S.settings.target:+v.elh, wt:v.wt===""?null:+v.wt, wtm:v.wtm===""?null:+v.wtm};
  }, {note:"Actual hours (ALH) come from your sessions automatically."});
}
function settingsForm(){
  const s = S.settings;
  sheet("Settings", [
    {k:"pomo", label:"Pomodoro length (minutes)", type:"number", value:s.pomo},
    {k:"short", label:"Short break (minutes)", type:"number", value:s.short},
    {k:"long", label:"Long break (minutes)", type:"number", value:s.long},
    {k:"setSize", label:"Pomodoros before a long break", type:"number", value:s.setSize},
    {k:"target", label:"Daily target study hours", type:"number", value:s.target},
    {k:"gaps", label:"Revision gaps in days (R1 to R5)", value:s.gaps.join(", ")},
    {k:"weak", label:"Weak accuracy line (%)", type:"number", value:s.weak},
    {k:"wake", label:"Keep screen on during a Pomodoro", type:"select", options:["Yes","No"], value:s.wake?"Yes":"No"},
    {k:"data", label:"Backup", type:"select", options:["No action","Download backup file","Restore from backup file","Erase all my data"], value:"No action"}
  ], v => {
    const g = v.gaps.split(/[,\s]+/).map(Number).filter(n => n > 0);
    if (g.length < 1) return "Give at least one revision gap";
    for (const k of ["pomo","short","long","setSize","target"]) if (!(+v[k] > 0)) return "Numbers must be more than 0";
    Object.assign(s, {pomo:+v.pomo, short:+v.short, long:+v.long, setSize:Math.round(+v.setSize), target:+v.target, gaps:g, weak:+v.weak||0, wake:v.wake==="Yes"});
    if (v.data === "Download backup file") exportData();
    if (v.data === "Restore from backup file") importData();
    if (v.data === "Erase all my data" && confirm("Erase all topics, sessions and logs on this phone? This cannot be undone.")) {
      S.topics = []; S.sessions = []; S.days = {}; S.timer = null;
    }
  });
}
function exportData(){
  const blob = new Blob([JSON.stringify({settings:S.settings, topics:S.topics, sessions:S.sessions, days:S.days}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "study-planner-backup-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(){
  const i = document.createElement("input"); i.type = "file"; i.accept = "application/json,.json";
  i.onchange = () => { const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.topics) || !Array.isArray(d.sessions)) throw 0;
        if (!confirm("Replace the data on this phone with the backup (" + d.topics.length + " topics, " + d.sessions.length + " sessions)?")) return;
        S.topics = d.topics; S.sessions = d.sessions; S.days = d.days || {}; S.settings = Object.assign({}, DEF, d.settings||{});
        save(); render(); toast("Backup restored");
      } catch(e){ toast("That file is not a Study Planner backup"); } };
    r.readAsText(f); };
  i.click();
}

/* ---------- timer ---------- */
let wakeLock = null, audio = null;
const phaseMin = p => p === "focus" ? S.settings.pomo : p === "short" ? S.settings.short : S.settings.long;
function timerRemaining(){
  const t = S.timer; if (!t) return S.settings.pomo * 60000;
  return t.running ? Math.max(0, t.endAt - Date.now()) : t.left;
}
async function wake(on){
  try {
    if (on && S.settings.wake && "wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
function startTimer(){
  if (!audio) { try { audio = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(()=>{});
  let t = S.timer;
  if (!t) t = S.timer = {phase:"focus", count:0, left:S.settings.pomo*60000, running:false, total:S.settings.pomo*60000};
  if (t.phase === "focus" && t.left === t.total) Object.assign(t, {type:S.draft.type, subject:S.draft.subject, topic:S.draft.topic});
  t.endAt = Date.now() + t.left; t.running = true;
  wake(t.phase === "focus"); save(); render();
}
function pauseTimer(){ const t = S.timer; if (!t || !t.running) return; t.left = Math.max(0, t.endAt - Date.now()); t.running = false; wake(false); save(); render(); }
function logFocus(t, endMs, minutes, pomos){
  if (minutes < 1) return;
  const st = endMs - minutes*60000;
  S.sessions.push({id:uid(), date:ymd(new Date(st)), type:t.type||"Study", subject:t.subject||"", topic:t.topic||"", start:st, end:endMs, min:Math.round(minutes), pomos, qa:0, qc:0});
}
function stopTimer(){
  const t = S.timer; if (!t) return;
  if (t.phase === "focus") {
    const done = (t.total - timerRemaining()) / 60000;
    if (done >= 1 && confirm("Stop now and log " + Math.round(done) + " min as a session? (It will not count as a full Pomodoro.)")) logFocus(t, Date.now(), done, 0);
    S.timer = {phase:"focus", count:t.count, left:S.settings.pomo*60000, total:S.settings.pomo*60000, running:false};
  } else {
    S.timer = {phase:"focus", count:t.count, left:S.settings.pomo*60000, total:S.settings.pomo*60000, running:false};
  }
  wake(false); save(); render();
}
function resetSet(){ S.timer = null; wake(false); save(); render(); }
function alertUser(title, body){
  try { if (audio) { const now = audio.currentTime;
    [0, .35, .7].forEach(d => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.001, now+d); g.gain.exponentialRampToValueAtTime(.4, now+d+.02); g.gain.exponentialRampToValueAtTime(.001, now+d+.28); o.start(now+d); o.stop(now+d+.3); }); } } catch(e){}
  try { navigator.vibrate && navigator.vibrate([300,150,300]); } catch(e){}
  try { if ("Notification" in window && Notification.permission === "granted") {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(title, {body, icon:"icon-192.png", tag:"pomo", renotify:true})).catch(()=>{});
    else new Notification(title, {body});
  } } catch(e){}
  toast(title);
}
function phaseEnd(){
  const t = S.timer, end = t.endAt;
  if (t.phase === "focus") {
    logFocus(t, end, t.total/60000, 1);
    const count = t.count + 1, long = count % S.settings.setSize === 0;
    const ph = long ? "long" : "short", ms = phaseMin(ph)*60000;
    S.timer = {phase:ph, count, left:ms, total:ms, running:true, endAt:end + ms, type:t.type, subject:t.subject, topic:t.topic};
    alertUser("Pomodoro done", long ? "Take a long break: " + S.settings.long + " min" : "Short break: " + S.settings.short + " min");
  } else {
    const ms = S.settings.pomo*60000;
    S.timer = {phase:"focus", count:t.count, left:ms, total:ms, running:false};
    alertUser("Break over", "Start your next Pomodoro");
  }
  wake(false); save(); render();
}
setInterval(() => {
  const t = S.timer;
  if (t && t.running) {
    if (Date.now() >= t.endAt) phaseEnd();
    else if (S.tab === "timer") paintClock();
  }
}, 500);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.timer && S.timer.running && S.timer.phase === "focus") wake(true); });
function paintClock(){
  const el = $("#clock"); if (!el) return;
  const left = timerRemaining(), t = S.timer, total = t ? t.total : S.settings.pomo*60000;
  const s = Math.ceil(left/1000);
  el.textContent = pad(Math.floor(s/60)) + ":" + pad(s%60);
  const C = 2*Math.PI*45; $("#pg").style.strokeDashoffset = C * (1 - left/total);
  document.title = (t && t.running ? el.textContent + " · " : "") + "Study Planner";
}

/* ---------- views ---------- */
const ICON = {
  today:'<svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 7"/><circle cx="12" cy="12" r="10"/></svg>',
  timer:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>',
  topics:'<svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',
  log:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'
};
const TABS = [["today","Today"],["timer","Timer"],["topics","Topics"],["log","Log"],["stats","Stats"]];
let logDate = today(), topicFilter = "All";

function topicRow(t, withActions){
  const st = status(t), nd = nextDue(t), n = t.done.length, g = S.settings.gaps.length;
  let dots = ""; for (let i=0;i<g;i++) dots += "<i class='"+(i<n?"d":(i===n&&nd&&nd<=today()?"n":""))+"'></i>";
  return "<div class='item'><div class='row between'><div class='grow' data-edit='"+t.id+"'>"
    + "<div class='title'>"+esc(t.topic)+"</div>"
    + "<div class='small mute'>"+esc(t.subject)+" · "+(nd ? "R"+(n+1)+" due "+nice(nd) : "all revisions done")+(t.acc!=null?" · "+t.acc+"%":"")+"</div>"
    + "<div class='dots'>"+dots+"</div></div>"
    + "<span class='chip "+st.k+"'>"+st.label+"</span></div>"
    + (withActions && nd ? "<div class='row' style='margin-top:9px'><button class='btn sm pri' data-revise='"+t.id+"'>Revise now</button><button class='btn sm' data-done='"+t.id+"'>Mark done</button></div>" : "")
    + "</div>";
}
function viewToday(){
  const due = dueList(), ss = sessOn(today()), min = sumMin(ss), tgt = (S.days[today()]&&S.days[today()].elh!=null ? S.days[today()].elh : S.settings.target)*60;
  let h = "<div class='card'><h2>Today so far</h2><div class='stats'>"
    + "<div class='stat'><b>"+sumPomo(ss)+"</b><span>Pomodoros</span></div>"
    + "<div class='stat'><b>"+dur(min)+"</b><span>Studied of "+dur(tgt)+" target</span></div></div>"
    + "<button class='btn pri wide' style='margin-top:12px' data-go='timer'>"+(S.timer&&S.timer.running?"Open timer":"Start a Pomodoro")+"</button></div>";
  h += "<div class='card'><h2>Revise these first ("+due.length+")</h2>";
  if (!due.length) h += "<div class='empty'>"+(S.topics.length ? "Nothing due. Study something new, then add it in Topics." : "No topics yet. After you study a lecture, add it in Topics and its revision dates will show up here.")+"</div>";
  else h += due.map(t => topicRow(t, true)).join("");
  h += "</div>";
  const up = S.topics.filter(t => { const n = nextDue(t); return n && n > today(); }).sort((a,b)=>nextDue(a)<nextDue(b)?-1:1).slice(0,5);
  if (up.length) h += "<div class='card'><h2>Coming up</h2>"+up.map(t=>topicRow(t,false)).join("")+"</div>";
  return h;
}
function viewTimer(){
  const t = S.timer, ph = t ? t.phase : "focus", running = t && t.running;
  const fresh = !t || (ph === "focus" && !running && t.left === t.total);
  const lab = ph === "focus" ? "Focus" : ph === "short" ? "Short break" : "Long break";
  const cnt = t ? t.count % S.settings.setSize : 0, C = (2*Math.PI*45).toFixed(2);
  let dots = ""; for (let i=0;i<S.settings.setSize;i++) dots += "<i class='"+(i<cnt || (t&&ph==="long") ?"f":"")+"'></i>";
  let h = "<div class='card'><div class='ring "+(ph==="focus"?"":"rest")+"'><svg viewBox='0 0 100 100'><circle class='tr' cx='50' cy='50' r='45'/>"
    + "<circle class='pg' id='pg' cx='50' cy='50' r='45' stroke-dasharray='"+C+"' stroke-dashoffset='0'/></svg>"
    + "<div class='mid'><div class='phase'>"+lab+"</div><div class='time' id='clock'>--:--</div>"
    + "<div class='small mute'>"+(t&&t.count? t.count+" done this sitting":"")+"</div></div></div>"
    + "<div class='setdots'>"+dots+"</div>";
  if (fresh) {
    h += "<div class='seg' id='typeSeg'>"+["Study","Revision","PYQ / Test"].map(x=>"<button class='"+(S.draft.type===x?"on":"")+"' data-type='"+esc(x)+"'>"+x+"</button>").join("")+"</div>"
      + "<datalist id='subjList2'>"+subjects().map(s=>"<option value='"+esc(s)+"'>").join("")+"</datalist>"
      + "<label for='dSub'>Subject</label><input id='dSub' list='subjList2' value='"+esc(S.draft.subject)+"' placeholder='e.g. Steel Structure'>"
      + "<label for='dTop'>Topic / lecture</label><input id='dTop' value='"+esc(S.draft.topic)+"' placeholder='e.g. Lec 3 - Tension Member'>";
  } else if (t && (t.subject || t.topic)) {
    h += "<div class='empty' style='padding:4px'><span class='chip'>"+esc(t.type||"Study")+"</span> "+esc([t.subject,t.topic].filter(Boolean).join(" · "))+"</div>";
  }
  h += "<div class='row' style='margin-top:14px'>";
  if (running) h += "<button class='btn grow' data-t='pause'>Pause</button><button class='btn grow danger' data-t='stop'>"+(ph==="focus"?"Stop":"Skip break")+"</button>";
  else h += "<button class='btn pri grow' data-t='start'>"+(fresh?"Start "+S.settings.pomo+" min focus":"Resume")+"</button>"+(fresh?"":"<button class='btn grow danger' data-t='stop'>"+(ph==="focus"?"Stop":"Skip break")+"</button>");
  h += "</div>";
  if (t && t.count && !running) h += "<button class='btn sm wide' style='margin-top:8px' data-t='reset'>Finish sitting (reset count)</button>";
  h += "</div><div class='card'><h2>The rule</h2><div class='small mute'>"+S.settings.pomo+" min of full focus, then a "+S.settings.short+" min break. After "+S.settings.setSize+" Pomodoros take a "+S.settings.long+" min break. Phone face down. Each finished Pomodoro is logged for you. Keep this app open so the alarm rings on time.</div></div>";
  return h;
}
function viewTopics(){
  const subs = ["All"].concat([...new Set(S.topics.map(t=>t.subject))].sort());
  if (!subs.includes(topicFilter)) topicFilter = "All";
  const list = S.topics.filter(t => topicFilter==="All" || t.subject===topicFilter)
    .sort((a,b) => { const x = nextDue(a)||"9999", y = nextDue(b)||"9999"; return x<y?-1:x>y?1:0; });
  let h = "";
  if (subs.length > 2) h += "<div class='card' style='padding:10px'><select id='tf'>"+subs.map(s=>"<option"+(s===topicFilter?" selected":"")+">"+esc(s)+"</option>").join("")+"</select></div>";
  h += "<div class='card'><h2>"+list.length+" topic"+(list.length===1?"":"s")+"</h2>";
  h += list.length ? list.map(t=>topicRow(t, false)).join("") : "<div class='empty'>Tap + after you finish a new lecture or chapter. Tap a topic to edit it.</div>";
  h += "</div><button class='fab' data-add='topic' aria-label='Add topic'>+</button>";
  return h;
}
function viewLog(){
  const d = logDate, x = S.days[d] || {}, ss = sessOn(d).sort((a,b)=>a.start-b.start), alh = sumMin(ss);
  const elh = (x.elh!=null ? x.elh : S.settings.target)*60;
  let cbh = null;
  if (x.st && x.wut) { const f = s => { const [a,b] = s.split(":").map(Number); return a*60+b; }; cbh = (f(x.wut) - f(x.st) + 1440) % 1440; }
  const twt = (x.wt||0) + (x.wtm||0), acc = accOf(ss);
  let h = "<div class='card'><div class='row'><button class='btn sm' data-day='-1' aria-label='Previous day'>&lsaquo;</button><input type='date' id='ld' class='grow' value='"+d+"' max='"+today()+"'>"
    + "<button class='btn sm' data-day='1' aria-label='Next day'"+(d>=today()?" disabled":"")+">&rsaquo;</button></div></div>";
  h += "<div class='card'><div class='row between'><h2 style='margin:0'>Day log</h2><button class='btn sm' data-dayform='1'>"+(S.days[d]?"Edit":"Fill in")+"</button></div>"
    + "<div class='stats' style='margin-top:10px'>"
    + "<div class='stat'><b>"+dur(alh)+"</b><span>ALH · actual study</span></div>"
    + "<div class='stat'><b>"+(elh?Math.round(100*alh/elh):0)+"%</b><span>of "+dur(elh)+" target (ELH)</span></div>"
    + "<div class='stat'><b>"+(cbh==null?"–":dur(cbh))+"</b><span>CBH · bed hours</span></div>"
    + "<div class='stat'><b>"+(x.wt==null&&x.wtm==null?"–":dur(twt))+"</b><span>TWT · wasted"+(x.wtm?" ("+dur(x.wtm)+" mobile)":"")+"</span></div>"
    + "<div class='stat'><b>"+sumPomo(ss)+"</b><span>Pomodoros</span></div>"
    + "<div class='stat'><b>"+(acc==null?"–":acc+"%")+"</b><span>Question accuracy</span></div></div></div>";
  h += "<div class='card'><h2>Sessions</h2>";
  h += ss.length ? ss.map(s => "<div class='item' data-sess='"+s.id+"'><div class='row between'><div class='grow'><div class='title'>"+esc(s.topic||s.subject||s.type)+"</div>"
      + "<div class='small mute'>"+esc(s.subject||"")+(s.subject?" · ":"")+hm(s.start)+" to "+hm(s.end)+(s.qa?" · "+s.qc+"/"+s.qa+" correct ("+Math.round(100*s.qc/s.qa)+"%)":"")+"</div></div>"
      + "<div style='text-align:right'><div class='title'>"+dur(s.min)+"</div><span class='chip'>"+esc(s.type)+"</span></div></div></div>").join("")
    : "<div class='empty'>No sessions on this day. Use the Timer, or tap + to add one by hand.</div>";
  h += "<div class='small mute' style='margin-top:8px'>Tap a session to add questions solved or correct it.</div></div><button class='fab' data-add='session' aria-label='Add session'>+</button>";
  return h;
}
function viewStats(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), days = new Date(y, m+1, 0).getDate();
  const pre = y+"-"+pad(m+1)+"-", ms = S.sessions.filter(s => s.date.startsWith(pre));
  const act = sumMin(ms)/60, tgt = days*S.settings.target, acc = accOf(ms);
  let wasted = 0; Object.keys(S.days).forEach(k => { if (k.startsWith(pre)) wasted += (S.days[k].wt||0) + (S.days[k].wtm||0); });
  const studiedDays = new Set(ms.map(s=>s.date)).size;
  let h = "<div class='card'><h2>"+now.toLocaleDateString(undefined,{month:"long",year:"numeric"})+"</h2><div class='stats'>"
    + "<div class='stat'><b>"+act.toFixed(1)+" h</b><span>Actual study hours</span></div>"
    + "<div class='stat'><b>"+tgt+" h</b><span>Target ("+days+" days × "+S.settings.target+" h)</span></div>"
    + "<div class='stat'><b>"+(tgt?Math.round(100*act/tgt):0)+"%</b><span>Efficiency (actual / target)</span></div>"
    + "<div class='stat'><b>"+(act/days).toFixed(1)+" h</b><span>Average per day</span></div>"
    + "<div class='stat'><b>"+sumPomo(ms)+"</b><span>Pomodoros</span></div>"
    + "<div class='stat'><b>"+ms.filter(s=>s.type==="Revision").length+"</b><span>Revision sessions</span></div>"
    + "<div class='stat'><b>"+(wasted/60).toFixed(1)+" h</b><span>Total wasted time</span></div>"
    + "<div class='stat'><b>"+(acc==null?"–":acc+"%")+"</b><span>Question accuracy</span></div>"
    + "</div><div class='small mute' style='margin-top:8px'>Studied on "+studiedDays+" of "+now.getDate()+" days so far.</div></div>";
  const last = []; for (let i=6;i>=0;i--) { const d = addDays(today(), -i); last.push([d, sumMin(sessOn(d))/60]); }
  const mx = Math.max(S.settings.target, ...last.map(x=>x[1]), 1);
  h += "<div class='card'><h2>Last 7 days (hours)</h2><div class='bars'>"+last.map(x => "<div><b>"+(x[1]?x[1].toFixed(1):"")+"</b><i style='height:"+Math.round(78*x[1]/mx)+"px'></i>"+parse(x[0]).toLocaleDateString(undefined,{weekday:"short"})+"</div>").join("")+"</div></div>";
  const c = {Mastered:0, Overdue:0, "Due today":0, Weak:0, Upcoming:0}; S.topics.forEach(t => c[status(t).label]++);
  h += "<div class='card'><h2>Topics</h2><div class='row' style='flex-wrap:wrap;gap:6px'>"
    + "<span class='chip bad'>"+c.Overdue+" overdue</span><span class='chip warn'>"+c["Due today"]+" due today</span><span class='chip weak'>"+c.Weak+" weak</span><span class='chip'>"+c.Upcoming+" upcoming</span><span class='chip ok'>"+c.Mastered+" mastered</span></div></div>";
  return h;
}
function render(){
  const v = {today:viewToday, timer:viewTimer, topics:viewTopics, log:viewLog, stats:viewStats}[S.tab] || viewToday;
  $("#hTitle").textContent = TABS.find(t=>t[0]===S.tab)[1];
  $("#hSub").textContent = S.tab === "log" ? niceLong(logDate) : niceLong(today());
  $("#view").innerHTML = v();
  const n = dueList().length;
  $("#nav").innerHTML = TABS.map(t => "<button class='"+(t[0]===S.tab?"on":"")+"' data-tab='"+t[0]+"'>"+ICON[t[0]]+t[1]+(t[0]==="today"&&n?"<span class='badge'>"+n+"</span>":"")+"</button>").join("");
  if (S.tab === "timer") paintClock(); else document.title = "Study Planner";
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tab],[data-go],[data-revise],[data-done],[data-edit],[data-add],[data-t],[data-type],[data-sess],[data-day],[data-dayform]");
  if (!el || el.closest(".sheet")) return;
  const d = el.dataset;
  if (d.tab || d.go) { S.tab = d.tab || d.go; save(); render(); window.scrollTo(0,0); }
  else if (d.revise) reviseNow(d.revise);
  else if (d.done) markDone(d.done);
  else if (d.edit) editTopic(d.edit);
  else if (d.add === "topic") addTopic();
  else if (d.add === "session") sessionForm(null);
  else if (d.sess) sessionForm(S.sessions.find(s => s.id === d.sess));
  else if (d.type) { S.draft.type = d.type; save(); render(); }
  else if (d.t === "start") startTimer();
  else if (d.t === "pause") pauseTimer();
  else if (d.t === "stop") stopTimer();
  else if (d.t === "reset") resetSet();
  else if (d.day) { const n = addDays(logDate, +d.day); if (n <= today()) { logDate = n; render(); } }
  else if (d.dayform) dayForm(logDate);
});
document.addEventListener("input", e => {
  if (e.target.id === "dSub") { S.draft.subject = e.target.value; save(); }
  if (e.target.id === "dTop") { S.draft.topic = e.target.value; save(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "ld" && e.target.value) { logDate = e.target.value > today() ? today() : e.target.value; render(); }
  if (e.target.id === "tf") { topicFilter = e.target.value; render(); }
});
$("#gear").addEventListener("click", settingsForm);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
